name: Build MoneyMichelle APK

on:
  push:
    branches: [ mochell-Bridge ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Install dependencies
        run: npm install

      - name: Prepare www folder (fix webDir)
        run: |
          mkdir -p www
          cp index.html www/ || true
          cp -r css js data assets lib www/ 2>/dev/null || true
          cp -r api www/ 2>/dev/null || true
          ls www

      - name: Add Android platform
        run: npx cap add android

      - name: Sync to Android
        run: npx cap sync android

      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyMichelle-APK
          path: android/app/build/outputs/apk/debug/money-michelle.apk
